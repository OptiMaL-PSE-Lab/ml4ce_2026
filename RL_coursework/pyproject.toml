[project]
name = "ML4CE_RL_CW_2026"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

dependencies = [
    "torch",
    "numpy",  
    "gymnasium",
    "tqdm",
    "matplotlib",
    "pandas",
    "pvlib",
    "jupyterlab",
    "ipykernel",
    "ipywidgets",
    "notebook",
    "highspy",
    "scipy",
    "packaging",
]

[project.optional-dependencies]
dev = [
    "mkdocs",
    "pytest",
    "ruff>=0.15.21",
    "types-tqdm>=4.68.0.20260608"
    ]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["course_package*"]
namespaces = true

# CPU-only torch on Linux and Windows (the default wheel pulls GBs of CUDA libraries).
# macOS wheels on PyPI are already CPU-only.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
